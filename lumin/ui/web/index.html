<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8" />
    <title>Luminesce — Assistant</title>

    <!-- Tailwind CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- CSS -->
    <link rel="stylesheet" href="/static/css/base.css" />
    <link rel="stylesheet" href="/static/css/theme.css" />

    <link rel="icon" href="/static/favicon.ico" />

    <style>
        .bubble-user {
            background: #2563eb;
            color: #ffffff;

            padding: 0.6rem 1rem;
            border-radius: 0.75rem;

            max-width: 60rem;

            font-size: 0.95rem;
            white-space: pre-wrap;
        }

        .bubble-assistant {
            background: #e5e7eb;
            color: #111827;

            padding: 1rem 1.25rem;
            border-radius: 0.75rem;

            width: 100%;
            box-sizing: border-box;

            font-size: 0.95rem;
            line-height: 1.6;

            word-wrap: break-word;
            overflow-wrap: break-word;
        }

        /* Code blocks */

        .bubble-assistant pre {
            background: #1f1f1f;
            color: #e5e7eb;

            font-family:
                "Cascadia Code",
                "JetBrains Mono",
                Consolas,
                "Courier New",
                monospace;

            font-size: 14px;
            line-height: 1.35;

            padding: 10px 14px;
            border-radius: 8px;

            overflow-x: auto;

            margin: 0.5rem 0;
        }

        .bubble-assistant code {
            font-family:
                "Cascadia Code",
                "JetBrains Mono",
                Consolas,
                "Courier New",
                monospace;
        }

        /* Headers */

        .bubble-assistant h1,
        .bubble-assistant h2,
        .bubble-assistant h3 {
            font-weight: 700;
            margin-top: 0.5rem;
            margin-bottom: 0.5rem;
        }

        .bubble-assistant h1 {
            font-size: 1.25rem;
        }

        .bubble-assistant h2 {
            font-size: 1.1rem;
        }

        .bubble-assistant h3 {
            font-size: 1rem;
        }

        /* Lists */

        .bubble-assistant ul,
        .bubble-assistant ol {
            margin-left: 1.5rem;
            margin-top: 0.25rem;
            margin-bottom: 0.25rem;
        }

        .bubble-assistant li {
            margin-bottom: 0.15rem;
        }

        /* Tables */

        .bubble-assistant table {
            border-collapse: collapse;
            width: 100%;
            margin: 0.5rem 0;
        }

        .bubble-assistant th,
        .bubble-assistant td {
            border: 1px solid #cbd5e1;
            padding: 6px 8px;
            text-align: left;
        }

        .bubble-assistant th {
            background: #f3f4f6;
        }

        /* Blockquotes */

        .bubble-assistant blockquote {
            border-left: 4px solid #60a5fa;
            padding-left: 12px;
            margin: 0.5rem 0;
            color: #4b5563;
        }

        /* Hide Scrollbars */

        .scrollbar-hide::-webkit-scrollbar {
            display: none;
        }
    </style>
</head>

<body class="h-full bg-gray-100 text-gray-900">
<div class="h-full flex">

    <!-- LEFT SIDEBAR -->
    <aside class="w-56 bg-white border-r border-gray-300 p-4 flex flex-col gap-6">
        <h1 class="text-2xl font-bold">Luminesce</h1>

        <div>
            <h2 class="font-semibold mb-2">Sessions</h2>
            <div id="session-list" class="flex flex-col gap-2">
                <button class="px-3 py-2 bg-gray-200 rounded hover:bg-gray-300"
                        onclick="newSession()">+ New Session</button>
            </div>
        </div>

        <div id="models-panel">

        <div>
            <strong>Active</strong><br>
            <span id="active-model"></span>
        </div>

        <br>

        <div>
            <strong>Select</strong><br>
            <select id="model-select"
                    class="w-full p-2 border rounded"
                    onchange="setModel()"></select>
        </div>

        </div>
        
        <div>
            <h2 class="font-semibold mb-2">Personality</h2>
            <select id="personality-select"
                    class="w-full p-2 border rounded"
                    onchange="setPersonality()"></select>
        </div>

        <div class="mt-auto flex flex-col gap-2">
            <button onclick="clearChat()"
                    class="px-3 py-2 bg-red-500 text-white rounded hover:bg-red-600">
                Clear Chat
            </button>

            <button onclick="forgetEverything()"
                    class="px-3 py-2 bg-red-700 text-white rounded hover:bg-red-800">
                Forget Everything
            </button>
        </div>
    </aside>

    <!-- CENTER CHAT -->
    <main class="flex-1 flex flex-col">

        <div id="chat-window"
             class="flex-1 overflow-y-auto p-6 space-y-4 scrollbar-hide">
        </div>

        <!-- INPUT BOX -->
        <div class="p-4 bg-white border-t border-gray-300 flex gap-3">
            <textarea id="chat-input"
                      class="flex-1 p-3 border rounded resize-none h-20"
                      placeholder="Type your message…"></textarea>

            <button onclick="sendMessage()"
                    class="px-6 py-3 bg-blue-600 text-white rounded hover:bg-blue-700">
                Send
            </button>

            <button
                    id="record-btn"
                    onclick="toggleRecording()"
                    class="px-6 py-3 bg-red-600 text-white rounded hover:bg-red-700">
                Record
            </button>

            <button onclick="stopSpeech()">
                Stop Speech
            </button>

            <button onclick="openFilePicker()">Upload File</button>
            <input type="file" id="file-input" class="hidden" onchange="uploadSelectedFile()" />
        </div>
    </main>

    <!-- RIGHT SIDEBAR -->

    <aside id="brain-panel"
       class="w-40 bg-white border-l border-gray-300 p-3 overflow-y-auto text-xs">
 
        <div class="flex justify-between items-center mb-4">
            <h2 class="font-bold">
                Assistant Brain
            </h2>

            <button onclick="toggleBrainPanel()">
                🧠
            </button>
        </div>

        <details class="mb-4">
            <summary class="cursor-pointer font-semibold">Reasoning</summary>
            <pre id="reasoning-panel"
                 class="bg-gray-100 p-3 rounded text-sm overflow-x-auto"></pre>
        </details>

        <details class="mb-4">
            <summary class="cursor-pointer font-semibold">Tool Calls</summary>
            <pre id="tool-panel"
                 class="bg-gray-100 p-3 rounded text-sm overflow-x-auto"></pre>
        </details>

        <details class="mb-4">
            <summary class="cursor-pointer font-semibold">RAG</summary>
            <pre id="rag-panel"
                 class="bg-gray-100 p-3 rounded text-sm overflow-x-auto"></pre>
        </details>

        <details class="mb-4">
            <summary class="cursor-pointer font-semibold">Semantic Memory</summary>
            <pre id="semantic-panel"
                 class="bg-gray-100 p-3 rounded text-sm overflow-x-auto"></pre>
        </details>

        <details class="mb-4">
            <summary class="cursor-pointer font-semibold">System Info</summary>
            <pre id="system-panel"
                 class="bg-gray-100 p-3 rounded text-sm overflow-x-auto"></pre>
        </details>

    </aside>

</div>

<!-- JS MODULES -->
<script src="/static/js/websocket.js"></script>
<script src="/static/js/ui.js"></script>
<script src="/static/js/tools.js"></script>
<script src="/static/js/rag.js"></script>
<script src="/static/js/mcp.js"></script>

<script>
function sendMessage() {
    const input = document.getElementById("chat-input");
    const text = input.value.trim();
    if (!text) return;
    window.wsSend(text);
    input.value = "";
}

function newSession() {
    alert("Multi-session support coming soon!");
}

function clearChat() {
    document.getElementById("chat-window").innerHTML = "";
}

function forgetEverything() {
    window.wsSend("forget everything");
}

function setModel() {
    const model = document.getElementById("model-select").value;
    fetch("/api/set-model", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({model})
    }).then(() => {
        refreshSystemInfo();
        refreshSemanticStatus();
    });
}

function setPersonality() {
    const personality = document.getElementById("personality-select").value;
    fetch("/api/set-personality", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({personality})
    });
}

function openFilePicker() {
    document.getElementById("file-input").click();
}

async function uploadSelectedFile() {
    const fileInput = document.getElementById("file-input");
    const file = fileInput.files[0];
    if (!file) return;

    const formData = new FormData();
    formData.append("file", file);

    const res = await fetch("/api/upload", {
        method: "POST",
        body: formData
    });

    const data = await res.json();

    const chat = document.getElementById("chat-window");
    const bubble = document.createElement("div");
    bubble.className = "bubble-assistant";
    bubble.textContent = data.reply;
    chat.appendChild(bubble);
    chat.scrollTop = chat.scrollHeight;

    fileInput.value = "";
}

/* NEW: Speak Chat Input */
function speakChatInput() {
    const text = document.getElementById("chat-input").value.trim();
    if (!text) return;
    window.speakText(text);
}

function toggleBrainPanel() {

    const panel =
        document.getElementById("brain-panel");

    panel.classList.toggle("hidden");
}

</script>

<script src="/static/js/speech.js"></script>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

</body>
</html>
