<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Luminesce</title>

    <!-- CSS -->
    <link rel="stylesheet" href="/static/css/base.css">
    <link rel="stylesheet" href="/static/css/theme.css">
</head>

<body>

    <!-- Top Model Bar -->
    <div id="model-bar">
        <div id="model-bar-left">
            <div>
                <strong>Model:</strong>
                <select id="model-picker"></select>
            </div>
            <div>
                <strong>Personality:</strong>
                <select id="personality-picker"></select>
            </div>
        </div>

        <div id="model-bar-right">
            <div id="connection-status">
                <span id="connection-dot"></span>
                <span id="connection-label">Offline</span>
            </div>
            <button id="export-chat">Export chat</button>
            <div id="model-info">Loading model info…</div>
        </div>
    </div>

    <!-- Chat -->
    <div id="chat-container"></div>

    <!-- Input Bar -->
    <div id="input-bar">
        <input id="input" placeholder="Type a message...">
        <button id="send">Send</button>
        <input id="file-input" type="file" style="display:none">
        <button id="upload-btn">+</button>
    </div>

    <!-- Reasoning Panel -->
    <div id="reasoning-panel" style="display:none; margin-top: 20px;">
        <h3>Agent Reasoning</h3>
        <pre id="reasoning-text"></pre>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/lib/common.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/styles/github-dark.min.css">

    <!-- JS Modules -->
    <script type="module" src="/static/js/websocket.js"></script>
    <script type="module" src="/static/js/streaming.js"></script>
    <script type="module" src="/static/js/tools.js"></script>
    <script type="module" src="/static/js/mcp.js"></script>
    <script type="module" src="/static/js/rag.js"></script>
    <script type="module" src="/static/js/ui.js"></script>

    <!-- Bootstrap -->
    <script type="module">
        import { loadConfig, initInputHandlers } from "/static/js/ui.js";
        loadConfig();
        initInputHandlers();
    </script>

</body>
</html>
