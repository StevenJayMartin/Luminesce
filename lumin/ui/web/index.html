<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8" />
    <title>Luminesce — Assistant</title>

    <!-- Tailwind CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- CSS -->
    <link rel="stylesheet" href="/static/css/base.css" />
    <link rel="stylesheet" href="/static/css/theme.css" />

    <link rel="icon" href="/static/favicon.ico" />

    <style>
        .bubble-user {
            background: #2563eb;
            color: #ffffff;
            padding: 0.5rem 1rem;
            border-radius: 0.75rem;
            max-width: 40rem;
            font-size: 0.95rem;
            white-space: pre-wrap;
        }
        .bubble-assistant {
            background: #e5e7eb;
            color: #111827;
            padding: 0.5rem 1rem;
            border-radius: 0.75rem;
            max-width: 40rem;
            font-size: 0.95rem;
            white-space: pre-wrap;
        }
        .scrollbar-hide::-webkit-scrollbar {
            display: none;
        }
    </style>
</head>

<body class="h-full bg-gray-100 text-gray-900">
<div class="h-full flex">

    <!-- LEFT SIDEBAR -->
    <aside class="w-64 bg-white border-r border-gray-300 p-4 flex flex-col gap-6">
        <h1 class="text-2xl font-bold">Luminesce</h1>

        <div>
            <h2 class="font-semibold mb-2">Sessions</h2>
            <div id="session-list" class="flex flex-col gap-2">
                <button class="px-3 py-2 bg-gray-200 rounded hover:bg-gray-300"
                        onclick="newSession()">+ New Session</button>
            </div>
        </div>

        <div>
            <h2 class="font-semibold mb-2">Model</h2>
            <select id="model-select"
                    class="w-full p-2 border rounded"
                    onchange="setModel()"></select>
        </div>

        <div>
            <h2 class="font-semibold mb-2">Personality</h2>
            <select id="personality-select"
                    class="w-full p-2 border rounded"
                    onchange="setPersonality()"></select>
        </div>

        <div class="mt-auto flex flex-col gap-2">
            <button onclick="clearChat()"
                    class="px-3 py-2 bg-red-500 text-white rounded hover:bg-red-600">
                Clear Chat
            </button>

            <button onclick="forgetEverything()"
                    class="px-3 py-2 bg-red-700 text-white rounded hover:bg-red-800">
                Forget Everything
            </button>
        </div>
    </aside>

    <!-- CENTER CHAT -->
    <main class="flex-1 flex flex-col">

        <div id="chat-window"
             class="flex-1 overflow-y-auto p-6 space-y-4 scrollbar-hide">
        </div>

        <!-- INPUT BOX -->
        <div class="p-4 bg-white border-t border-gray-300 flex gap-3">
            <textarea id="chat-input"
                      class="flex-1 p-3 border rounded resize-none h-20"
                      placeholder="Type your message…"></textarea>

            <button onclick="sendMessage()"
                    class="px-6 py-3 bg-blue-600 text-white rounded hover:bg-blue-700">
                Send
            </button>

            <!-- NEW: Speak Button -->
            <button onclick="speakChatInput()"
                    class="px-6 py-3 bg-green-600 text-white rounded hover:bg-green-700">
                Speak
            </button>

            <button onclick="openFilePicker()">Upload File</button>
            <input type="file" id="file-input" class="hidden" onchange="uploadSelectedFile()" />
        </div>
    </main>

    <!-- RIGHT SIDEBAR -->
    <aside class="w-80 bg-white border-l border-gray-300 p-4 overflow-y-auto">

        <h2 class="text-xl font-bold mb-4">Assistant Brain</h2>

        <details class="mb-4">
            <summary class="cursor-pointer font-semibold">Reasoning</summary>
            <pre id="reasoning-panel"
                 class="bg-gray-100 p-3 rounded text-sm overflow-x-auto"></pre>
        </details>

        <details class="mb-4">
            <summary class="cursor-pointer font-semibold">Tool Calls</summary>
            <pre id="tool-panel"
                 class="bg-gray-100 p-3 rounded text-sm overflow-x-auto"></pre>
        </details>

        <details class="mb-4">
            <summary class="cursor-pointer font-semibold">RAG</summary>
            <pre id="rag-panel"
                 class="bg-gray-100 p-3 rounded text-sm overflow-x-auto"></pre>
        </details>

        <details class="mb-4">
            <summary class="cursor-pointer font-semibold">Semantic Memory</summary>
            <pre id="semantic-panel"
                 class="bg-gray-100 p-3 rounded text-sm overflow-x-auto"></pre>
        </details>

        <details class="mb-4">
            <summary class="cursor-pointer font-semibold">System Info</summary>
            <pre id="system-panel"
                 class="bg-gray-100 p-3 rounded text-sm overflow-x-auto"></pre>
        </details>

    </aside>

</div>

<!-- JS MODULES -->
<script src="/static/js/websocket.js"></script>
<script src="/static/js/ui.js"></script>
<script src="/static/js/tools.js"></script>
<script src="/static/js/rag.js"></script>
<script src="/static/js/mcp.js"></script>

<script>
function sendMessage() {
    const input = document.getElementById("chat-input");
    const text = input.value.trim();
    if (!text) return;
    window.wsSend(text);
    input.value = "";
}

function newSession() {
    alert("Multi-session support coming soon!");
}

function clearChat() {
    document.getElementById("chat-window").innerHTML = "";
}

function forgetEverything() {
    window.wsSend("forget everything");
}

function setModel() {
    const model = document.getElementById("model-select").value;
    fetch("/api/set-model", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({model})
    }).then(() => {
        refreshSystemInfo();
        refreshSemanticStatus();
    });
}

function setPersonality() {
    const personality = document.getElementById("personality-select").value;
    fetch("/api/set-personality", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({personality})
    });
}

function openFilePicker() {
    document.getElementById("file-input").click();
}

async function uploadSelectedFile() {
    const fileInput = document.getElementById("file-input");
    const file = fileInput.files[0];
    if (!file) return;

    const formData = new FormData();
    formData.append("file", file);

    const res = await fetch("/api/upload", {
        method: "POST",
        body: formData
    });

    const data = await res.json();

    const chat = document.getElementById("chat-window");
    const bubble = document.createElement("div");
    bubble.className = "bubble-assistant";
    bubble.textContent = data.reply;
    chat.appendChild(bubble);
    chat.scrollTop = chat.scrollHeight;

    fileInput.value = "";
}

/* NEW: Speak Chat Input */
function speakChatInput() {
    const text = document.getElementById("chat-input").value.trim();
    if (!text) return;
    window.speakText(text);
}
</script>

<script type="module">
    import * as ort from "/static/onnx/ort.min.mjs";
    window.ort = ort;
</script>

<script type="module">
    import { speakText } from "/static/tts/tts.js";
    window.speakText = speakText;
</script>

</body>
</html>
